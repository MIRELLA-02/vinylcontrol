<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estoque e vendas | Vinyl Control</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
<header class="topbar">
    <a class="brand" href="dashboard.html"><span class="disc">◉</span> Vinyl Control</a>
    <nav>
      <a href="dashboard.html">Início</a>
      <a href="discos.html">Discos</a>
      <a href="estoque.html" class="active">Estoque e vendas</a>
    </nav>
    <div class="user"><span id="nomeUsuario"></span><button id="btnSair" class="btn btn-light" type="button">Sair</button></div>
  </header>
  <main>
    <div class="page-title">
      <h1>Estoque e vendas</h1>
      <a class="btn btn-outline" href="dashboard.html">← Voltar ao início</a>
    </div>
    <div id="mensagem" class="alert" role="alert" hidden></div>
    <div id="alertaEstoque" class="alert" role="alert" hidden></div>

    <section class="card">
      <h2>Registrar movimentação</h2>
      <form id="formMov" novalidate>
        <div class="grid grid-form">
          <div>
            <label for="discoId">Disco</label>
            <select id="discoId" required><option value="">Carregando...</option></select>
            <div id="dicaEstoque" class="hint"></div>
          </div>
          <div>
            <label for="tipo">Tipo</label>
            <select id="tipo" required>
              <option value="entrada">Entrada (reposição ou compra)</option>
              <option value="saida">Saída (venda)</option>
            </select>
          </div>
          <div><label for="quantidade">Quantidade</label><input type="number" id="quantidade" min="1" step="1" required></div>
          <div><label for="data">Data</label><input type="date" id="data" required></div>
        </div>
        <div class="field" style="margin-top:1rem">
          <label for="observacao">Observação (opcional)</label>
          <textarea id="observacao" rows="2" maxlength="255"></textarea>
        </div>
        <button type="submit" id="btnRegistrar" class="btn">Registrar</button>
      </form>
    </section>

    <section class="card">
      <h2>Situação do estoque</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Título</th><th>Artista</th><th>Estoque</th><th>Mínimo</th><th>Situação</th></tr></thead>
          <tbody id="corpoTabela"><tr><td colspan="5" class="empty">Carregando...</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="card" id="cardHistorico">
      <h2>Histórico de movimentações</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Disco</th><th>Tipo</th><th>Quantidade</th><th>Usuário</th></tr></thead>
          <tbody id="corpoHistorico"><tr><td colspan="5" class="empty">Carregando...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/estoque.js"></script>
</body>
</html>
