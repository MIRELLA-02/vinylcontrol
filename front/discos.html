<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discos | Vinyl Control</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
<header class="topbar">
    <a class="brand" href="dashboard.html"><span class="disc">◉</span> Vinyl Control</a>
    <nav>
      <a href="dashboard.html">Início</a>
      <a href="discos.html" class="active">Discos</a>
      <a href="estoque.html">Estoque e vendas</a>
    </nav>
    <div class="user"><span id="nomeUsuario"></span><button id="btnSair" class="btn btn-light" type="button">Sair</button></div>
  </header>
  <main>
    <div class="page-title">
      <h1>Cadastro de discos</h1>
      <a class="btn btn-outline" href="dashboard.html">← Voltar ao início</a>
    </div>
    <div id="mensagem" class="alert" role="alert" hidden></div>

    <section class="card">
      <h2 id="tituloForm">Novo disco</h2>
      <form id="formDisco" novalidate>
        <div class="grid grid-form">
          <div><label for="titulo">Título</label><input type="text" id="titulo" required></div>
          <div><label for="artista">Artista ou banda</label><input type="text" id="artista" required></div>
          <div><label for="genero">Gênero</label><input type="text" id="genero" required></div>
          <div><label for="precoCusto">Preço de custo (R$)</label><input type="number" id="precoCusto" min="0.01" step="0.01" required></div>
          <div><label for="precoVenda">Preço de venda (R$)</label><input type="number" id="precoVenda" min="0.01" step="0.01" required></div>
          <div><label for="quantidade">Quantidade em estoque</label><input type="number" id="quantidade" min="0" step="1" required></div>
          <div><label for="estoqueMinimo">Estoque mínimo</label><input type="number" id="estoqueMinimo" min="0" step="1" required></div>
        </div>
        <div class="actions">
          <button type="submit" id="btnSalvar" class="btn">Salvar</button>
          <button type="button" id="btnCancelar" class="btn btn-outline" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Discos cadastrados</h2>
      <label for="busca">Buscar por título, artista ou gênero</label>
      <input type="search" id="busca" class="search" placeholder="Digite para buscar...">
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Título</th><th>Artista</th><th>Gênero</th><th>Custo</th><th>Venda</th><th>Estoque</th><th>Mínimo</th><th>Ações</th></tr></thead>
          <tbody id="corpoTabela"><tr><td colspan="9" class="empty">Carregando...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/discos.js"></script>
</body>
</html>
