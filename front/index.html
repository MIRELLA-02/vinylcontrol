<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Vinyl Control</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="card login-box">
    <div class="logo">◉</div>
    <h1>Vinyl Control</h1>
    <p class="sub">Acesse o sistema da loja</p>
    <div id="mensagem" class="alert" role="alert" hidden></div>
    <form id="formLogin" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" required>
      </div>
      <button type="submit" id="btnEntrar" class="btn" style="width:100%">Entrar</button>
    </form>
  </main>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
